# Render Blueprint: https://render.com/docs/blueprint-spec

databases:
  - name: inbank-db
    databaseName: inbank
    user: inbank
    plan: free

services:
  - type: web
    name: inbank
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /InBank/login
    envVars:
      - key: INBANK_DB_HOST
        fromDatabase:
          name: inbank-db
          property: host
      - key: INBANK_DB_PORT
        fromDatabase:
          name: inbank-db
          property: port
      - key: INBANK_DB_NAME
        fromDatabase:
          name: inbank-db
          property: database
      - key: INBANK_DB_USER
        fromDatabase:
          name: inbank-db
          property: user
      - key: INBANK_DB_PASSWORD
        fromDatabase:
          name: inbank-db
          property: password
